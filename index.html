<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Builder</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #090b10;
    color: #f4f6fb;
    min-height: 100vh;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* HEADER */

.header {
    height: 72px;
    background: #10131a;
    border-bottom: 1px solid #252a35;
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 30px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
    white-space: nowrap;
}

.logo span {
    color: #4f8cff;
}

.search {
    flex: 1;
    max-width: 650px;
    position: relative;
}

.search input {
    width: 100%;
    height: 42px;
    background: #181c24;
    border: 1px solid #2a303c;
    border-radius: 12px;
    color: white;
    padding: 0 16px;
    outline: none;
    transition: .2s;
}

.search input:focus {
    border-color: #4f8cff;
    box-shadow: 0 0 0 3px rgba(79,140,255,.12);
}

.header-price {
    margin-left: auto;
    text-align: right;
}

.header-price small {
    color: #8d96a7;
    display: block;
    font-size: 11px;
}

.header-price strong {
    font-size: 18px;
}

/* LAYOUT */

.layout {
    display: grid;
    grid-template-columns: 235px 1fr 330px;
    min-height: calc(100vh - 72px);
}

/* SIDEBAR */

.sidebar {
    background: #0e1117;
    border-right: 1px solid #242934;
    padding: 22px 14px;
}

.sidebar-title {
    color: #777f90;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 12px 12px;
}

.category {
    width: 100%;
    border: 0;
    background: transparent;
    color: #aab1bf;
    padding: 12px;
    border-radius: 10px;
    text-align: left;
    margin-bottom: 4px;
    transition: .2s;
}

.category:hover {
    background: #181c24;
    color: white;
}

.category.active {
    background: #1b2740;
    color: #6ea0ff;
}

.category span {
    display: inline-block;
    width: 25px;
}

/* MAIN */

.main {
    padding: 28px;
    overflow: hidden;
}

.page-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.page-title h1 {
    font-size: 30px;
}

.page-title p {
    color: #8c95a5;
    margin-top: 6px;
}

.random-btn {
    background: #171c25;
    color: #fff;
    border: 1px solid #303746;
    border-radius: 10px;
    padding: 10px 14px;
    transition: .2s;
}

.random-btn:hover {
    border-color: #4f8cff;
    background: #1b2230;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
}

.product {
    background: #11151c;
    border: 1px solid #252b36;
    border-radius: 16px;
    overflow: hidden;
    transition: .2s;
}

.product:hover {
    transform: translateY(-3px);
    border-color: #3b4658;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.product-image {
    height: 155px;
    background:
        radial-gradient(circle at 50% 35%, rgba(79,140,255,.25), transparent 45%),
        linear-gradient(145deg, #171c26, #0d1016);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
}

.product-body {
    padding: 15px;
}

.product-category {
    color: #6f9eff;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: bold;
    margin-bottom: 7px;
}

.product-name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.35;
    min-height: 43px;
}

.product-info {
    color: #858e9e;
    font-size: 12px;
    margin: 8px 0;
    min-height: 30px;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 13px;
}

.product-price {
    font-size: 17px;
    font-weight: 800;
}

.add-btn {
    border: 0;
    background: #4f8cff;
    color: white;
    border-radius: 9px;
    padding: 9px 12px;
    font-weight: 700;
    transition: .2s;
}

.add-btn:hover {
    background: #6a9dff;
}

.add-btn.added {
    background: #25334c;
    color: #7fa9ff;
}

/* BUILD */

.build {
    background: #0d1016;
    border-left: 1px solid #242934;
    padding: 22px;
    position: sticky;
    top: 72px;
    height: calc(100vh - 72px);
    overflow-y: auto;
}

.build-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
}

.build-header h2 {
    font-size: 21px;
}

.clear-btn {
    background: transparent;
    border: 0;
    color: #ff6670;
    font-size: 12px;
}

.build-subtitle {
    color: #7d8696;
    font-size: 12px;
    margin-bottom: 18px;
}

.build-empty {
    border: 1px dashed #303644;
    border-radius: 14px;
    padding: 25px 15px;
    text-align: center;
    color: #70798a;
    line-height: 1.5;
    margin-bottom: 18px;
}

.build-item {
    background: #151922;
    border: 1px solid #292f3b;
    border-radius: 11px;
    padding: 11px;
    margin-bottom: 8px;
    display: flex;
    gap: 10px;
    align-items: center;
}

.build-icon {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: #1c2432;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.build-info {
    flex: 1;
    min-width: 0;
}

.build-name {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
}

.build-type {
    color: #737d8e;
    font-size: 10px;
    margin-top: 3px;
}

.build-cost {
    font-size: 12px;
    font-weight: bold;
    margin-top: 4px;
}

.remove-btn {
    border: 0;
    background: transparent;
    color: #697383;
    font-size: 17px;
}

.remove-btn:hover {
    color: #ff6670;
}

.build-summary {
    border-top: 1px solid #292f3a;
    margin-top: 18px;
    padding-top: 18px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    color: #8d96a5;
    margin-bottom: 10px;
    font-size: 13px;
}

.summary-total {
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: 800;
    margin-top: 15px;
}

.compatibility {
    margin-top: 16px;
    background: #12271e;
    color: #59d49a;
    border: 1px solid #1f523c;
    border-radius: 10px;
    padding: 11px;
    text-align: center;
    font-size: 12px;
}

.save-btn {
    width: 100%;
    margin-top: 10px;
    height: 43px;
    border: 0;
    background: #4f8cff;
    color: white;
    border-radius: 10px;
    font-weight: 700;
}

.save-btn:hover {
    background: #689dff;
}

/* MOBILE */

@media (max-width: 1100px) {
    .layout {
        grid-template-columns: 210px 1fr;
    }

    .build {
        display: none;
    }
}

@media (max-width: 720px) {
    .header {
        height: auto;
        padding: 15px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .search {
        order: 3;
        flex-basis: 100%;
        max-width: none;
    }

    .header-price {
        margin-left: auto;
    }

    .layout {
        display: block;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid #242934;
        display: flex;
        overflow-x: auto;
        padding: 10px;
        gap: 5px;
    }

    .sidebar-title {
        display: none;
    }

    .category {
        width: auto;
        white-space: nowrap;
        margin: 0;
    }

    .main {
        padding: 18px 14px;
    }

    .page-title {
        align-items: flex-start;
        gap: 12px;
    }

    .page-title h1 {
        font-size: 24px;
    }

    .random-btn {
        white-space: nowrap;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .product-image {
        height: 120px;
        font-size: 48px;
    }

    .product-body {
        padding: 11px;
    }

    .product-name {
        font-size: 13px;
    }

    .product-bottom {
        display: block;
    }

    .add-btn {
        width: 100%;
        margin-top: 8px;
    }
}

@media (max-width: 430px) {
    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

        <div class="build-summary">

            </div>

            <div class="summary-row">

                ✓ Базовая совместимость будет добавлена следующим этапом
            </div>

</div>

];

let currentCategory = "all";

let build = JSON.parse(
    localStorage.getItem("pc_builder_build") || "[]"
);

function formatPrice(price) {
    return price.toLocaleString("ru-RU") + " ₽";
}

function getCategoryName(category) {

    const names = {
        cpu: "Процессор",
        gpu: "Видеокарта",
        motherboard: "Материнская плата",
        ram: "Оперативная память",
        storage: "Накопитель",
        psu: "Блок питания",
        cooler: "Охлаждение",
        case: "Корпус"
    };

    return names[category] || category;
}

function renderProducts() {

    const container = document.getElementById("products");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let filtered = products.filter(product => {

        const categoryMatch =
            currentCategory === "all" ||
            product.category === currentCategory;

        const searchMatch =
            !search ||
            product.name.toLowerCase().includes(search) ||
            product.info.toLowerCase().includes(search);

        return categoryMatch && searchMatch;
    });

    container.innerHTML = "";

    if (filtered.length === 0) {

        container.innerHTML = `
            <div style="
                grid-column:1/-1;
                padding:50px;
                text-align:center;
                color:#7f8898;
            ">
                Ничего не найдено
            </div>
        `;

        return;
    }

    filtered.forEach(product => {

        const selected =
            build.some(item => item.id === product.id);

        const card = document.createElement("div");

        card.className = "product";

        card.innerHTML = `

            <div class="product-image">
                ${product.icon}
            </div>

            <div class="product-body">

                <div class="product-category">
                    ${getCategoryName(product.category)}
                </div>

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-info">
                    ${product.info}
                </div>

                <div class="product-bottom">

                    <div class="product-price">
                        ${formatPrice(product.price)}
                    </div>

                    <button
                        class="add-btn ${selected ? "added" : ""}"
                        onclick="toggleProduct(${product.id})"
                    >
                        ${selected ? "✓ Добавлено" : "+ Добавить"}
                    </button>

                </div>

            </div>
        `;

        container.appendChild(card);
    });
}

function toggleProduct(id) {

    const product = products.find(
        item => item.id === id
    );

    if (!product) return;

    const existingIndex =
        build.findIndex(
            item => item.category === product.category
        );

    if (existingIndex !== -1) {

        if (build[existingIndex].id === id) {

            build.splice(existingIndex, 1);

        } else {

            build[existingIndex] = product;

        }

    } else {

        build.push(product);

    }

    save();

    renderProducts();
    renderBuild();
}

function renderBuild() {

    const list =
        document.getElementById("buildList");

    if (build.length === 0) {

        list.innerHTML = `
            <div class="build-empty">
                🧩<br><br>
                Здесь появятся выбранные<br>
                комплектующие.
            </div>
        `;

    } else {

        list.innerHTML = "";

        build.forEach(product => {

            const item =
                document.createElement("div");

            item.className = "build-item";

            item.innerHTML = `

                <div class="build-icon">
                    ${product.icon}
                </div>

                <div class="build-info">

                    <div class="build-name">
                        ${product.name}
                    </div>

                    <div class="build-type">
                        ${getCategoryName(product.category)}
                    </div>

                    <div class="build-cost">
                        ${formatPrice(product.price)}
                    </div>

                </div>

                <button
                    class="remove-btn"
                    onclick="removeProduct(${product.id})"
                >
                    ×
                </button>
            `;

            list.appendChild(item);
        });
    }

    updateSummary();
}

function removeProduct(id) {

    build =
        build.filter(
            product => product.id !== id
        );

    save();

    renderProducts();
    renderBuild();
}

function clearBuild() {

    if (build.length === 0) return;

    if (!confirm("Очистить всю сборку?")) {
        return;
    }

    build = [];

    save();

    renderProducts();
    renderBuild();
}

function updateSummary() {

    const total =
        build.reduce(
            (sum, product) =>
                sum + product.price,
            0
        );

    const power =
        build.reduce(
            (sum, product) =>
                sum + product.power,
            0
        );

    document.getElementById("total")
        .textContent = formatPrice(total);

    document.getElementById("headerTotal")
        .textContent = formatPrice(total);

    document.getElementById("partsCount")
        .textContent = build.length;

    document.getElementById("power")
        .textContent = power + " W";
}

function save() {

    localStorage.setItem(
        "pc_builder_build",
        JSON.stringify(build)
    );
}

function saveBuild() {

    save();

    const button =
        document.querySelector(".save-btn");

    const oldText = button.textContent;

    button.textContent = "✓ Сохранено";

    setTimeout(() => {
        button.textContent = oldText;
    }, 1500);
}

function randomBuild() {

    const categories = [
        "cpu",
        "gpu",
        "motherboard",
        "ram",
        "storage",
        "psu",
        "cooler",
        "case"
    ];

    build = [];

    categories.forEach(category => {

        const items =
            products.filter(
                product =>
                    product.category === category
            );

        if (items.length) {

            const random =
                items[
                    Math.floor(
                        Math.random() * items.length
                    )
                ];

            build.push(random);
        }
    });

    save();

    renderProducts();
    renderBuild();
}

document
    .querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".category")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                button.classList.add("active");

                currentCategory =
                    button.dataset.category;

                renderProducts();
            }
        );
    });

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderProducts
    );

renderProducts();
renderBuild();

</script>

</html>
